services:
  mongo:
    image: mongo:7
    container_name: financial-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - financial-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  financial-mongo-data:
